name: Build CodeKotha Admin APK

on:
  push:
    paths:
      - 'tmp-admin-app/source.b64.part*'
      - '.github/workflows/chatgpt-build-codekotha-admin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Rebuild source and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          cat tmp-admin-app/source.b64.part* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/app.tar.gz
          mkdir -p /tmp/work
          tar -xzf /tmp/app.tar.gz -C /tmp/work
          cd /tmp/work/CodeKothaAdminApp
          gradle --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/CodeKotha-Admin-v1.0.0.apk
          sha256sum /tmp/CodeKotha-Admin-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codekotha-admin-apk
          path: /tmp/CodeKotha-Admin-v1.0.0.apk
          if-no-files-found: error
          retention-days: 1
