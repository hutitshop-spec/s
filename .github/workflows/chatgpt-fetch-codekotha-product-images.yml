name: Fetch CodeKotha Product Images

on:
  push:
    paths:
      - '.github/workflows/chatgpt-fetch-codekotha-product-images.yml'
  workflow_dispatch:

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Download original product images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-images
          fetch() {
            url="$1"
            out="$2"
            echo "Downloading $out"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120               -A "Mozilla/5.0 (compatible; CodeKothaAssetSync/1.0)"               "$url" -o "product-images/$out"
            test -s "product-images/$out"
            bytes=$(wc -c < "product-images/$out")
            if [ "$bytes" -lt 5000 ]; then
              echo "Downloaded file too small: $out ($bytes bytes)" >&2
              exit 1
            fi
            file "product-images/$out"
          }

          fetch "https://codekotha.com/wp-content/uploads/2026/01/reels-bundle.png" "200k-reels-bundle.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/OTT-Combo.png" "all-in-one-ott-pack.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/ff.png" "computer-software-master-pack.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/04/resized-image-1080x1080-1.jpeg" "computer-software-pro-pack.jpeg"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/Corce.png" "content-creator-pack.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/09/Duolingo-3.png" "duolingo-premium.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/Eyecon-Pro-Codekotha.png" "eyecon-pro.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/05/resized-image-1024x1024-1.jpeg" "hotflix.jpeg"
          fetch "https://codekotha.com/wp-content/uploads/2026/09/Gemini_Generated_Image_7qceg57qceg57qce.jpeg" "idm-lifetime.jpeg"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/Netflix-Premium-e1772537619530.png" "netflix-premium-1-year.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/04/15-APP.png" "premium-15-app.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/Android-ALL-App.png" "premium-40plus-app.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/9-app.png" "premium-9-app-bundle.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/04/truecaller.png" "truecaller-gold-lifetime.png"
          fetch "https://codekotha.com/wp-content/uploads/2026/01/Gemini_Generated_Image_t9l1ldt9l1ldt9l1-1.png" "ullu-premium.png"

          echo "Downloaded files:"
          ls -lh product-images

      - name: Upload product images artifact
        uses: actions/upload-artifact@v4
        with:
          name: codekotha-original-product-images
          path: product-images/
          if-no-files-found: error
          retention-days: 1
